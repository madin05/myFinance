<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>myfinanceid</title>
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16x16.png" />
    <link rel="manifest" href="/assets/site.webmanifest" />
    <script>
      // Apply saved theme ASAP to avoid flash / resetting on refresh.
      try {
        const theme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', theme);
      } catch {}
    </script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <!-- Sortable JS -->
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  </head>
  <body>
    
    <!-- Sidebar Overlay (Mobile Only) -->
    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <!-- Login View -->
    <div id="login-view" style="display: none;"></div>

    <!-- Main Dashboard Layout -->
    <div class="dashboard-container" id="app-layout" style="display: none;">
      
      <!-- Sidebar (Desktop Navigation) -->
      <aside class="sidebar">
        <div class="logo-container">
          <label class="hamburger mobile-only" id="btn-close-sidebar">
            <input type="checkbox" class="sidebar-checkbox" />
            <svg viewBox="0 0 32 32">
              <path
                class="line line-top-bottom"
                d="M27 10 13 10C10.8 10 9 8.2 9 6 9 3.5 10.8 2 13 2 15.2 2 17 3.8 17 6L17 26C17 28.2 18.8 30 21 30 23.2 30 25 28.2 25 26 25 23.8 23.2 22 21 22L7 22"
              ></path>
              <path class="line" d="M7 16 27 16"></path>
            </svg>
          </label>
          <button class="icon-btn" id="btn-toggle-sidebar"><i class="ph ph-list"></i></button>
            <a href="/dashboard" class="logo-wrapper" style="text-decoration: none;">
              <div class="logo-icon">
                <img src="/assets/logo-navbar-light.svg" class="logo-light" alt="MyFinance">
                <img src="/assets/logo-navbar-dark.svg" class="logo-dark" alt="MyFinance">
              </div>
            </a>
        </div>

        <nav class="sidebar-nav" id="sidebar-nav">
          <a href="/dashboard" class="nav-item" data-route="dashboard" data-tooltip-right="Dashboard">
            <i class="ph ph-house"></i>
            <span>Dashboard</span>
          </a>
          <a href="/transaksi" class="nav-item" data-route="transaksi" data-tooltip-right="Transaksi">
            <i class="ph ph-receipt"></i>
            <span>Transaksi</span>
          </a>
          <a href="/ai" class="nav-item" data-route="ai" data-tooltip-right="Asisten AI">
            <i class="ph ph-sparkle"></i>
            <span>Asisten AI</span>
          </a>
          <a href="/anggaran" class="nav-item" data-route="anggaran" data-tooltip-right="Atur Anggaran">
            <i class="ph ph-chart-pie-slice"></i>
            <span>Anggaran</span>
          </a>
          <a href="/tabungan" class="nav-item" data-route="tabungan" data-tooltip-right="Wishlist">
            <i class="ph ph-heart"></i>
            <span>Wishlist</span>
          </a>
          <a href="/saldo" class="nav-item" data-route="saldo" data-tooltip-right="Saldo Akun">
            <i class="ph ph-wallet"></i>
            <span>Saldo</span>
          </a>
          <a href="/laporan" class="nav-item" data-route="laporan" data-tooltip-right="Laporan Keuangan">
            <i class="ph ph-chart-bar"></i>
            <span>Laporan</span>
          </a>
          <a href="/akun" class="nav-item" data-route="akun" data-tooltip-right="Profil Saya">
            <i class="ph ph-user"></i>
            <span>Akun</span>
          </a>
          <a href="/faq" class="nav-item nav-item-bottom" data-route="faq" data-tooltip-right="Bantuan">
            <i class="ph ph-question"></i>
            <span>Bantuan</span>
          </a>
        </nav>
      </aside>

      <!-- Main Content -->
      <main class="main-content">
        <div class="dashboard-hero-bg">
          <!-- Soft Glowing Orbs -->
          <div class="hero-ornament-glow glow-1"></div>
          <div class="hero-ornament-glow glow-2"></div>

          <!-- Financial Character Doodles (Cute Line-Art Characters) -->
          <div class="hero-doodles">
            <!-- Character 1: Cheering at Financial Growth Chart -->
            <svg class="hero-doodle doodle-char-growth" width="95" height="95" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
              <circle cx="65" cy="26" r="10" stroke="rgba(255,255,255,0.32)" stroke-width="2.2"/>
              <circle cx="62" cy="25" r="1.2" fill="rgba(255,255,255,0.45)"/>
              <path d="M66 28 C65 29 63 29 62 28" stroke="rgba(255,255,255,0.35)" stroke-width="1.5" stroke-linecap="round"/>
              <path d="M65 36 V62 M65 42 L80 28 M65 42 L52 30" stroke="rgba(255,255,255,0.32)" stroke-width="2.2" stroke-linecap="round"/>
              <path d="M65 62 L55 82 M65 62 L75 82" stroke="rgba(255,255,255,0.32)" stroke-width="2.2" stroke-linecap="round"/>
              <path d="M10 75 L28 55 L42 62 L60 38" stroke="rgba(255,255,255,0.4)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M48 38 H60 V50" stroke="rgba(255,255,255,0.4)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
              <circle cx="60" cy="38" r="3.5" fill="rgba(255,255,255,0.6)"/>
              <rect x="12" y="65" width="8" height="15" rx="2" stroke="rgba(255,255,255,0.22)" stroke-width="1.8"/>
              <rect x="25" y="52" width="8" height="28" rx="2" stroke="rgba(255,255,255,0.22)" stroke-width="1.8"/>
              <rect x="38" y="42" width="8" height="38" rx="2" stroke="rgba(255,255,255,0.22)" stroke-width="1.8"/>
            </svg>

            <!-- Character 2: Holding Big Coin & Saving -->
            <svg class="hero-doodle doodle-char-saving" width="90" height="90" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
              <circle cx="40" cy="22" r="10" stroke="rgba(255,255,255,0.32)" stroke-width="2.2"/>
              <circle cx="37" cy="21" r="1.2" fill="rgba(255,255,255,0.45)"/>
              <path d="M42 24 C41 26 38 26 37 25" stroke="rgba(255,255,255,0.35)" stroke-width="1.5" stroke-linecap="round"/>
              <path d="M32 18 Q40 12 48 18" stroke="rgba(255,255,255,0.3)" stroke-width="2" stroke-linecap="round"/>
              <path d="M40 32 V58 M40 42 L25 35 M40 40 L60 30" stroke="rgba(255,255,255,0.32)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M40 58 L28 78 M40 58 L52 78" stroke="rgba(255,255,255,0.32)" stroke-width="2.2" stroke-linecap="round"/>
              <circle cx="68" cy="24" r="14" stroke="rgba(255,255,255,0.4)" stroke-width="2.2" stroke-dasharray="3 3"/>
              <circle cx="68" cy="24" r="9" stroke="rgba(255,255,255,0.48)" stroke-width="2"/>
              <path d="M68 18 V30 M65 21 H70 C72 21 72 23 68 24 C64 25 64 27 70 27 H72" stroke="rgba(255,255,255,0.48)" stroke-width="1.8" stroke-linecap="round"/>
              <path d="M85 10 L87 14 L91 16 L87 18 L85 22 L83 18 L79 16 L83 14 Z" fill="rgba(255,255,255,0.35)"/>
            </svg>
          </div>

          <!-- Dot Matrix Grid Overlay -->
          <div class="hero-ornament-grid"></div>

          <!-- Organic Wave & Curved Lines SVG -->
          <svg class="hero-ornament-svg" viewBox="0 0 1440 480" preserveAspectRatio="none" fill="none" xmlns="http://www.w3.org/2000/svg">
            <!-- Organic Bottom Wave Layer -->
            <path d="M0,300 C280,410 540,230 840,350 C1140,470 1320,290 1440,330 L1440,480 L0,480 Z" fill="url(#hero-wave-grad-1)" opacity="0.22"/>
            
            <!-- Soft Accent Wave Layer -->
            <path d="M250,0 C550,220 950,60 1440,190 L1440,0 Z" fill="url(#hero-wave-grad-2)" opacity="0.16"/>

            <!-- Accent Curved Line -->
            <path d="M-50,210 Q400,370 900,190 T1500,270" stroke="rgba(255, 255, 255, 0.28)" stroke-width="2" stroke-linecap="round" fill="none"/>

            <defs>
              <linearGradient id="hero-wave-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#ffffff" stop-opacity="0.75"/>
                <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05"/>
              </linearGradient>
              <linearGradient id="hero-wave-grad-2" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
                <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
              </linearGradient>
            </defs>
          </svg>
        </div>
        <!-- Header -->
        <header class="header">
          <!-- Far Left Corner: Profile Avatar & Dropdown -->
          <div class="user-profile" id="user-profile-trigger">
            <div class="avatar-wrapper skeleton skeleton-circle" style="width: 44px; height: 44px; position: relative;">
              <img id="user-avatar" src="" alt="User" referrerpolicy="no-referrer" style="opacity: 0; transition: opacity 0.3s; width: 100%; height: 100%; border-radius: 50%;" />
              <div class="status-indicator" id="network-status" title="Menghubungkan..."></div>
            </div>
            <div class="profile-dropdown" id="profile-dropdown">
              <div class="dropdown-header">
                <p class="user-name skeleton skeleton-text" id="nav-user-name"></p>
                <p class="user-email text-sm text-muted skeleton skeleton-text" id="nav-user-email"></p>
              </div>
              <div class="dropdown-divider"></div>
              <a href="/akun" class="dropdown-item">
                <i class="ph ph-user"></i> Profil Saya
              </a>
              <a href="/settings" class="dropdown-item">
                <i class="ph ph-gear"></i> Pengaturan
              </a>
              <a href="/laporan" class="dropdown-item">
                <i class="ph ph-chart-bar"></i> Laporan
              </a>
              <a href="/faq" class="dropdown-item">
                <i class="ph ph-question"></i> Bantuan
              </a>
              <div class="dropdown-divider profile-dropdown-theme-wrapper"></div>
              <div class="dropdown-item profile-dropdown-theme-wrapper" style="display: flex; align-items: center; justify-content: center; padding: 0.5rem; cursor: default; user-select: none;">
                <div class="theme-toggle-group" style="display: flex !important; margin: 0 auto;">
                  <button class="theme-auto-btn" id="btn-theme-auto-dropdown" title="Tema Otomatis (Ikut Perangkat)">
                    <i class="ph ph-desktop-tower"></i>
                  </button>
                  <label for="themeToggleDropdown" class="themeToggle st-sunMoonThemeToggleBtn" title="Ganti Tema">
                    <input type="checkbox" id="themeToggleDropdown" class="themeToggleInput" aria-label="Beralih Tema" />
                    <svg width="18" height="18" viewBox="0 0 20 20" fill="currentColor" stroke="none">
                      <mask id="moon-mask-dropdown">
                        <rect x="0" y="0" width="20" height="20" fill="white"></rect>
                        <circle cx="11" cy="3" r="8" fill="black"></circle>
                      </mask>
                      <circle class="sunMoon" cx="10" cy="10" r="8" mask="url(#moon-mask-dropdown)"></circle>
                      <g>
                        <circle class="sunRay sunRay1" cx="18" cy="10" r="1.5"></circle>
                        <circle class="sunRay sunRay2" cx="14" cy="16.928" r="1.5"></circle>
                        <circle class="sunRay sunRay3" cx="6" cy="16.928" r="1.5"></circle>
                        <circle class="sunRay sunRay4" cx="2" cy="10" r="1.5"></circle>
                        <circle class="sunRay sunRay5" cx="6" cy="3.1718" r="1.5"></circle>
                        <circle class="sunRay sunRay6" cx="14" cy="3.1718" r="1.5"></circle>
                      </g>
                    </svg>
                  </label>
                </div>
              </div>
              <div class="dropdown-divider"></div>
              <button class="dropdown-item text-red" id="btn-logout">
                <i class="ph ph-sign-out"></i> Logout
              </button>
            </div>
          </div>

          <div class="search-bar">
            <i class="ph ph-magnifying-glass search-icon"></i>
            <input type="text" id="global-search" placeholder="Cari transaksi..." />
          </div>

          <div class="header-actions">
            <!-- Theme Toggle Group: [Auto] + [Sun/Moon] wrapped in pill border -->
            <div class="theme-toggle-group">
              <button class="theme-auto-btn" id="btn-theme-auto" title="Tema Otomatis (Ikut Perangkat)">
                <i class="ph ph-desktop-tower"></i>
              </button>
              <label for="themeToggle" class="themeToggle st-sunMoonThemeToggleBtn" title="Ganti Tema">
                <input type="checkbox" id="themeToggle" class="themeToggleInput" />
                <svg width="18" height="18" viewBox="0 0 20 20" fill="currentColor" stroke="none">
                  <mask id="moon-mask">
                    <rect x="0" y="0" width="20" height="20" fill="white"></rect>
                    <circle cx="11" cy="3" r="8" fill="black"></circle>
                  </mask>
                  <circle class="sunMoon" cx="10" cy="10" r="8" mask="url(#moon-mask)"></circle>
                  <g>
                    <circle class="sunRay sunRay1" cx="18" cy="10" r="1.5"></circle>
                    <circle class="sunRay sunRay2" cx="14" cy="16.928" r="1.5"></circle>
                    <circle class="sunRay sunRay3" cx="6" cy="16.928" r="1.5"></circle>
                    <circle class="sunRay sunRay4" cx="2" cy="10" r="1.5"></circle>
                    <circle class="sunRay sunRay5" cx="6" cy="3.1718" r="1.5"></circle>
                    <circle class="sunRay sunRay6" cx="14" cy="3.1718" r="1.5"></circle>
                  </g>
                </svg>
              </label>
            </div>

            <!-- Notification Bell Dropdown (Integrated) -->
            <div class="header-btn-wrapper" id="notif-trigger">
              <button class="icon-btn" title="Notifikasi"><i class="ph-fill ph-bell"></i><span class="header-badge"></span></button>
              <div class="header-dropdown" id="notif-dropdown">
                <div class="dropdown-header" style="border-bottom:1px solid var(--border); padding: 1rem 1.25rem;">
                  <h4 style="margin:0; font-size:0.95rem; font-weight: 700;">Notifikasi Terbaru</h4>
                </div>
                <div class="dropdown-list">
                  <div style="padding: 2rem 1rem; text-align:center; color:var(--text-muted); font-size:0.85rem;">Memuat notifikasi...</div>
                </div>
                <a href="/notifikasi" class="view-all-btn" style="text-decoration: none;">Lihat Semua Notifikasi</a>
              </div>
            </div>
          </div>
        </header>
        <main class="page-content" id="page-content">
        <!-- Initial Skeleton for fast loading appearance -->
        <div class="skeleton-wrapper" style="padding: 1.5rem;">
          <div class="skeleton" style="height: 40px; width: 40%; margin-bottom: 2.5rem; border-radius: 8px;"></div>
          
          <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 2rem;">
            <!-- Left Skeleton (Profile Style) -->
            <div class="stat-card" style="padding: 2.5rem 1.5rem; display: flex; flex-direction: column; align-items: center; gap: 1.5rem;">
              <div class="skeleton" style="width: 120px; height: 120px; border-radius: 50%;"></div>
              <div class="skeleton" style="width: 60%; height: 24px; border-radius: 6px;"></div>
              <div class="skeleton" style="width: 40%; height: 16px; border-radius: 4px;"></div>
              <div class="skeleton" style="width: 80%; height: 40px; border-radius: 100px; margin-top: 1rem;"></div>
            </div>
            
            <!-- Right Skeleton (Form Style) -->
            <div style="display: flex; flex-direction: column; gap: 1.5rem;">
              <div class="stat-card" style="padding: 2rem; display: flex; flex-direction: column; gap: 1.5rem;">
                <div class="skeleton" style="width: 30%; height: 20px; border-radius: 4px;"></div>
                <div class="skeleton" style="width: 100%; height: 48px; border-radius: 12px;"></div>
                <div class="skeleton" style="width: 100%; height: 48px; border-radius: 12px;"></div>
                <div class="skeleton" style="width: 40%; height: 44px; border-radius: 10px; align-self: flex-end;"></div>
              </div>
              <div class="stat-card" style="padding: 1.5rem; height: 100px;">
                <div class="skeleton" style="width: 50%; height: 20px; border-radius: 4px; margin-bottom: 1rem;"></div>
                <div class="skeleton" style="width: 100%; height: 40px; border-radius: 8px; margin-top: 10px;"></div>
              </div>
            </div>
          </div>
        </div>
      </main>

      <!-- Mobile Bottom Navigation Bar -->
      <nav class="bottom-nav" id="bottom-nav" aria-label="Navigasi Utama">
        <a href="/dashboard" class="bottom-nav-item" data-route="dashboard" id="bnav-dashboard">
          <i class="ph ph-house"></i>
          <span>Dashboard</span>
        </a>
        <a href="/transaksi" class="bottom-nav-item" data-route="transaksi" id="bnav-transaksi">
          <i class="ph ph-receipt"></i>
          <span>Transaksi</span>
        </a>
        <button type="button" class="bottom-nav-fab" id="bnav-fab" aria-label="Tambah Transaksi">
          <div class="bottom-nav-fab-btn">
            <i class="ph-bold ph-plus"></i>
          </div>
          <span>Tambah</span>
        </button>
        <a href="/saldo" class="bottom-nav-item" data-route="saldo" id="bnav-saldo">
          <i class="ph ph-wallet"></i>
          <span>Saldo</span>
        </a>
        <a href="/akun" class="bottom-nav-item" data-route="akun" id="bnav-akun">
          <i class="ph ph-user"></i>
          <span>Akun</span>
        </a>
      </nav>

      <!-- Floating Action Menu (FAM) -->
      <aside class="menu-tooltip-container">
        <input type="checkbox" id="fam-toggle" />
        <label for="fam-toggle" class="fam-trigger">
          <i class="ph-bold ph-plus"></i>
        </label>
        
        <div class="fam-item" style="--i: 1">
          <button class="fam-anchor bg-primary" id="btn-fam-add-tx" data-tooltip-left="Tambah Transaksi">
            <i class="ph-fill ph-receipt"></i>
          </button>
        </div>
        <div class="fam-item" style="--i: 0">
          <button class="fam-anchor bg-primary" id="btn-fam-wishlist" data-tooltip-top="Ke Wishlist">
            <i class="ph-fill ph-heart"></i>
          </button>
        </div>
        <div class="fam-item" style="--i: 2">
          <button class="fam-anchor bg-primary" id="btn-fam-calculator" data-tooltip-left="Kalkulator">
            <i class="ph-fill ph-calculator"></i>
          </button>
        </div>
        <div class="fam-item" style="--i: 3">
          <button class="fam-anchor bg-primary" id="btn-fam-scan-receipt" data-tooltip-left="Scan Struk">
            <i class="ph-fill ph-scan"></i>
          </button>
        </div>
        <div class="fam-item" style="--i: 4" hidden></div>
        <div class="fam-item" style="--i: 5" hidden></div>
        <div class="fam-item" style="--i: 6" hidden></div>
        <div class="fam-item" style="--i: 7" hidden></div>
      </aside>

    </div> <!-- End of #app-layout -->

    <div id="modal-container"></div>

    <!-- Global Loading Overlay -->
    <div id="loading-overlay" class="loading-overlay" style="display: none;">
      <div class="loading-content">
        <video src="/assets/coin.webm" autoplay loop muted playsinline width="180" height="180"></video>
        <p>Sedang memproses...</p>
      </div>
    </div>

    <!-- Email Verification Banner (fixed overlay, zero layout impact) -->
    <div id="email-verify-banner" class="email-verify-banner" style="display: none;" role="alert" aria-live="polite"></div>

    <script type="module" src="/src/main.js?v=final"></script>
  </body>
</html>
